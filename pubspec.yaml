name: emc_youtube_app
description: "A new Flutter project for HAT TRICK - 999."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.1.0 # (သို့မဟုတ် နောက်ဆုံးဗားရှင်း)
  shared_preferences: ^2.2.2
  http: ^1.2.0
  firebase_core: ^2.27.0
  firebase_messaging: ^14.7.19
  cloud_firestore: ^4.15.8
  
flutter:
  assets:
    - .env

  
  # Firebase Packages
  firebase_core: ^2.24.2
  cloud_firestore: ^4.14.0
  firebase_messaging: ^14.7.10

  # Local Storage & Network Packages
  shared_preferences: ^2.2.2
  http: ^1.2.0
  
  # Environment Variables Package (အသစ်ထည့်လိုက်သည်)
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Asset များနှင့် .env ဖိုင် ချိတ်ဆက်ခြင်း
  assets:
    - .env
